<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time to Farm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100 font-sans">
    <header class="bg-white shadow p-4 flex justify-between items-center">
        <a href="index.html">
            <h1 class="text-lg font-bold text-green-600">Time to Farm</h1>
        </a>
        <nav class="flex space-x-4">
            <select id="priceFilter" class="hover:text-green-600 bg-white">
                <option value="all">ทั้งหมด</option>
                <option value="fruit">ราคาผลไม้</option>
                <option value="vegetable">ราคาผัก</option>
            </select>
            <a href="cal.html" class="text-gray-700 hover:text-green-600">คำนวณพื้นที่</a>
        </nav>
    </header>

    <section class="text-center p-4 sm:p-8 bg-green-50">
        <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-4">
            "เว็บไซต์ช่วยวางแผนปลูกผักผลไม้ <br>
            พร้อมข้อมูลราคาตลาดที่อัปเดตทุกวัน"
        </h2>
        <div class="mt-4 relative inline-block w-full sm:w-auto">
            <div class="flex items-center gap-2">
                <input type="text" id="searchInput" autocomplete="off" placeholder="ค้นหาพืชที่คุณต้องการ"
                    class="p-2 border border-gray-300 rounded-md w-full sm:w-80 focus:outline-none focus:ring-2 focus:ring-green-400">
                <button id="searchButton" class="p-2 bg-green-500 text-white rounded-md hover:bg-green-600">
                    ค้นหา
                </button>
            </div>
            <div id="searchDropdown"
                class="absolute left-0 z-10 w-full sm:w-80 bg-white border border-gray-300 rounded-md mt-1 shadow-lg hidden max-h-60 overflow-y-auto">
            </div>
        </div>
    </section>

    <main class="p-4 sm:p-8">
        <section id="fruits-section" class="mb-8">
            <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-4">ราคาผลไม้</h3>
            <div id="fruits-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            </div>
        </section>

        <section id="vegetables-section">
            <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-4">ราคาผัก</h3>
            <div id="vegetables-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            </div>
        </section>

        <template id="product-card">
            <a href="#"
                class="bg-white shadow rounded-lg p-3 sm:p-4 text-center block hover:shadow-lg transition-shadow">
                <img src="" alt="" class="h-24 sm:h-32 w-full object-cover mb-2 sm:mb-4 rounded">
                <h4 class="text-base sm:text-lg font-semibold"></h4>
                <p class="text-green-600 font-bold text-sm sm:text-base"></p>
                <p class="text-gray-500 text-xs sm:text-sm"></p>
            </a>
        </template>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC4zuda9WnUNjmLXnKBbmoExJuGZP1Cz2E",
            authDomain: "time-to-farm.firebaseapp.com",
            projectId: "time-to-farm",
            storageBucket: "time-to-farm.firebasestorage.app",
            messagingSenderId: "797670152835",
            appId: "1:797670152835:web:5ccdedbc14855d18db19b6"
        };

        async function initIndex() {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();

            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const searchDropdown = document.getElementById('searchDropdown');
            const priceFilter = document.getElementById('priceFilter');
            const fruitsSection = document.getElementById('fruits-section');
            const vegetablesSection = document.getElementById('vegetables-section');
            let allProducts = [];
            let productsLoaded = false;

            async function loadProducts() {
                if (productsLoaded) return;
                try {
                    const response = await fetch('../src/data/products.json');
                    const priceSnapshot = await db.collection('historical_prices').get();
                    const data = await response.json();

                    const priceDataMap = {};
                    priceSnapshot.forEach(doc => {
                        priceDataMap[doc.id] = doc.data().priceData;
                    });

                    allProducts = [
                        ...data.fruits.map(f => ({
                            ...f,
                            type: 'fruit',
                            priceData: priceDataMap[f.id.toString()]
                        })),
                        ...data.vegetables.map(v => ({
                            ...v,
                            type: 'vegetable',
                            priceData: priceDataMap[v.id.toString()]
                        }))
                    ];

                    productsLoaded = true;

                    displayProducts();
                    setupSearch();
                    setupFilter();
                } catch (error) {
                    console.error('Error loading products:', error);
                }
            }

            function displayProducts() {
                const template = document.getElementById('product-card');

                const fruitsContainer = document.getElementById('fruits-container');
                fruitsContainer.innerHTML = '';
                const fruits = allProducts.filter(p => p.type === 'fruit');

                const fruitsFragment = document.createDocumentFragment();
                for (const fruit of fruits) {
                    const latestPrice = fruit.priceData?.data?.items[fruit.priceData.data.items.length - 1];

                    const card = template.content.cloneNode(true);
                    const cardLink = card.querySelector('a');
                    cardLink.href = `data.html?type=fruit&name=${encodeURIComponent(fruit.name)}`;
                    cardLink.querySelector('img').src = fruit.image;
                    cardLink.querySelector('img').alt = fruit.name;
                    cardLink.querySelector('h4').textContent = fruit.name;
                    cardLink.querySelector('.text-green-600').textContent =
                        latestPrice ? `฿${latestPrice.low} - ${latestPrice.high} / ${fruit.unit}` : 'ไม่มีข้อมูล';
                    cardLink.querySelector('.text-gray-500').textContent =
                        latestPrice ? latestPrice.date : 'ไม่มีข้อมูล';
                    fruitsFragment.appendChild(card);
                }
                fruitsContainer.appendChild(fruitsFragment);

                const vegetablesContainer = document.getElementById('vegetables-container');
                vegetablesContainer.innerHTML = '';
                const vegetables = allProducts.filter(p => p.type === 'vegetable');

                const vegetablesFragment = document.createDocumentFragment();
                for (const vegetable of vegetables) {
                    const latestPrice = vegetable.priceData?.data?.items[vegetable.priceData.data.items.length - 1];

                    const card = template.content.cloneNode(true);
                    const cardLink = card.querySelector('a');
                    cardLink.href = `data.html?type=vegetable&name=${encodeURIComponent(vegetable.name)}`;
                    cardLink.querySelector('img').src = vegetable.image;
                    cardLink.querySelector('img').alt = vegetable.name;
                    cardLink.querySelector('h4').textContent = vegetable.name;
                    cardLink.querySelector('.text-green-600').textContent =
                        latestPrice ? `฿${latestPrice.low} - ${latestPrice.high} / ${vegetable.unit}` : 'ไม่มีข้อมูล';
                    cardLink.querySelector('.text-gray-500').textContent =
                        latestPrice ? latestPrice.date : 'ไม่มีข้อมูล';
                    vegetablesFragment.appendChild(card);
                }
                vegetablesContainer.appendChild(vegetablesFragment);
            }

            function debounce(fn, delay) {
                let timeoutID;
                return function (...args) {
                    clearTimeout(timeoutID);
                    timeoutID = setTimeout(() => {
                        fn.apply(this, args);
                    }, delay);
                };
            }

            function setupSearch() {
                const handleSearchInput = debounce((e) => {
                    const searchTerm = e.target.value.toLowerCase();
                    if (searchTerm.length < 2) {
                        searchDropdown.classList.add('hidden');
                        return;
                    }

                    const matches = allProducts.filter(product =>
                        product.name.toLowerCase().includes(searchTerm)
                    );

                    displayDropdownResults(matches);
                }, 300);

                searchInput.addEventListener('input', handleSearchInput);

                searchButton.addEventListener('click', () => {
                    filterProducts(searchInput.value);
                });

                document.addEventListener('click', (e) => {
                    if (!searchDropdown.contains(e.target) && e.target !== searchInput) {
                        searchDropdown.classList.add('hidden');
                    }
                });
            }

            function setupFilter() {
                priceFilter.addEventListener('change', () => {
                    const selectedType = priceFilter.value;
                    filterByType(selectedType);
                });
            }

            function filterByType(type) {
                if (type === 'all') {
                    fruitsSection.style.display = 'block';
                    vegetablesSection.style.display = 'block';
                } else if (type === 'fruit') {
                    fruitsSection.style.display = 'block';
                    vegetablesSection.style.display = 'none';
                } else if (type === 'vegetable') {
                    fruitsSection.style.display = 'none';
                    vegetablesSection.style.display = 'block';
                }
            }

            function displayDropdownResults(matches) {
                searchDropdown.innerHTML = '';

                if (matches.length > 0) {
                    const dropdownFragment = document.createDocumentFragment();
                    matches.forEach(product => {
                        const div = document.createElement('div');
                        div.className = 'p-2 hover:bg-gray-100 cursor-pointer border-b border-gray-200 flex items-center gap-3';

                        const img = document.createElement('img');
                        img.src = product.image;
                        img.alt = product.name;
                        img.className = 'w-10 h-10 rounded-full object-cover';

                        const name = document.createElement('span');
                        name.textContent = product.name;

                        div.appendChild(img);
                        div.appendChild(name);

                        div.addEventListener('click', () => {
                            window.location.href = `data.html?type=${product.type}&name=${encodeURIComponent(product.name)}`;
                        });

                        dropdownFragment.appendChild(div);
                    });
                    searchDropdown.appendChild(dropdownFragment);
                    searchDropdown.classList.remove('hidden');
                } else {
                    searchDropdown.classList.add('hidden');
                }
            }

            function filterProducts(searchTerm) {
                searchTerm = searchTerm.toLowerCase();
                const allCards = document.querySelectorAll('#fruits-container a, #vegetables-container a');

                allCards.forEach(card => {
                    const productName = card.querySelector('h4').textContent.toLowerCase();
                    if (productName.includes(searchTerm)) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }

            loadProducts();
        }

        document.addEventListener('DOMContentLoaded', initIndex);
    </script>
</body>

</html>
